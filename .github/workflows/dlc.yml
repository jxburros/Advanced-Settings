name: Build DLC (called by release orchestration)
'on':
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      pack:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source-sha }}
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - run: npm ci --omit=dev --ignore-scripts
    - name: Package a declared DLC app
      env:
        PACK: ${{ inputs.pack }}
        VERSION: ${{ inputs.version }}
      run: |
        node --input-type=module -e 'import fs from "node:fs"; const id=process.env.PACK; if(!/^[a-z0-9-]+$/.test(id)||id==="example") throw Error("Invalid pack"); const manifest=JSON.parse(fs.readFileSync(`dlc/packs/${id}/manifest.json`)); const release=JSON.parse(fs.readFileSync("release.json")); if(manifest.version!==process.env.VERSION || release.apps[`dlc-${id}`]?.version!==manifest.version) throw Error("DLC must be declared and versioned in release.json");'
        node tools/pack-dlc.mjs "$PACK"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dlc-${{ inputs.pack }}
        path: |-
          dist/dlc-*.zip
          dlc/catalog.json
        if-no-files-found: error
