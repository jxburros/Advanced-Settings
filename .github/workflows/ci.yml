name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The game and its tests have no dependencies; nothing to install.
      - run: npm test
      - name: Versions and changelog agree
        run: node tools/release-notes.mjs > /dev/null
