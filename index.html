<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef0f8" />
    <title>Advanced Settings — Stillwater OS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236f97dc'/%3E%3Cstop offset='1' stop-color='%23e48cb0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 7c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="at-title">
    <div id="title" class="title">
      <div class="title-wash" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="title-scan" aria-hidden="true"></div>
      <div class="title-tear" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="title-inner">
        <h1 class="title-logo" aria-label="Advanced Settings">
          <span id="title-mark" class="title-mark"></span>
          <span class="title-word-wrap" aria-hidden="true"><span id="title-word" class="title-word"></span><span id="title-ghosts"></span></span>
        </h1>
        <div class="title-rule" aria-hidden="true"></div>
        <p class="title-tag"><span class="calm-only">Please do not adjust your calm.</span><span class="dark-only">A game played entirely through menus.</span></p>
        <div id="title-body" class="title-body"></div>
        <dl class="title-status dark-only" aria-hidden="true"><div><dt>Calm</dt><dd>On</dd></div><div><dt>Duck</dt><dd>On</dd></div><div><dt>Leave</dt><dd class="no">Unavailable</dd></div></dl>
      </div>
      <p id="title-version" class="title-foot"></p>
    </div>
    <div id="wallpaper" aria-hidden="true"></div>
    <header class="menubar">
      <div class="menus">
        <button class="logo" data-action="menu" data-id="logo" aria-label="Stillwater menu" aria-haspopup="menu">
          <span class="logo-mark"></span>
        </button>
        <strong id="active-app">Desktop</strong>
        <button class="menu" data-action="menu" data-id="file" aria-haspopup="menu">File</button>
        <button class="menu" data-action="menu" data-id="edit" aria-haspopup="menu">Edit</button>
        <button class="menu" data-action="menu" data-id="window" aria-haspopup="menu">Window</button>
        <button class="menu" data-action="menu" data-id="help" aria-haspopup="menu">Help</button>
      </div>
      <div class="status">
        <span id="stats" class="stats"></span>
        <button id="calm" class="calm" data-action="calm" aria-label="Calm Index"></button>
        <button id="nowplaying" class="status-btn nowplaying" data-action="open" data-id="music" hidden></button>
        <button id="wifi" class="status-btn" data-action="popover" data-id="wifi" aria-label="Network"></button>
        <button id="volume" class="status-btn" data-action="popover" data-id="volume" aria-label="Sound"></button>
        <button id="search-btn" class="status-btn" data-action="launcher" aria-label="Search (Ctrl+K)"></button>
        <button id="clock" class="status-btn clock" data-action="popover" data-id="calendar" aria-label="Calendar"></button>
      </div>
    </header>
    <main id="desktop">
      <div id="graffiti" class="graffiti" aria-hidden="true">the walls are thin here. — M.</div>
      <div id="icons" class="icons" aria-label="Desktop"></div>
      <div id="lasso" class="lasso" hidden></div>
      <aside id="widgets" class="widgets" aria-label="Widgets"></aside>
      <div id="windows"></div>
    </main>
    <nav id="dock" class="dock" aria-label="Dock"></nav>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="moment" class="moment" hidden></div>
    <div id="pop" class="pop" hidden></div>
    <div id="launcher" class="launcher" hidden></div>
    <div id="lock" class="lock" hidden></div>
    <div id="parade" class="parade" aria-hidden="true"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
